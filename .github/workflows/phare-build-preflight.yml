name: Project Shield L1 - PHARE Configure and Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phare-build-preflight
  cancel-in-progress: false

jobs:
  build-check:
    name: Configure and build pinned PHARE source
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DEBIAN_FRONTEND: noninteractive
      PHARE_REMOTE: https://github.com/PHAREHUB/PHARE.git
      PHARE_COMMIT: 7e5c72c1e5eec5452c8e3cfd000ce26c01e084ef

    steps:
      - name: Record runner resources and install scientific dependencies
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h .
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gfortran git pkg-config \
            openmpi-bin libopenmpi-dev libhdf5-openmpi-dev \
            python3-dev python3-venv
          mpirun --version | head -n 1
          h5pcc -showconfig | grep -E 'HDF5 Version|Parallel HDF5'

      - name: Verify exact PHARE source and prepare Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$PHARE_REMOTE" PHARE
          git -C PHARE checkout --detach "$PHARE_COMMIT"
          test "$(git -C PHARE rev-parse HEAD)" = "$PHARE_COMMIT"
          python3 -m venv "$RUNNER_TEMP/phare-venv"
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip install -r PHARE/requirements.txt ddt pybind11
          "$RUNNER_TEMP/phare-venv/bin/python" -c 'import numpy, scipy, h5py, ddt, pybind11; print("Python dependencies import: OK")'

      - name: Configure PHARE CMake (diagnostic gate)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/phare-venv/bin:$PATH"
          cmake -S PHARE -B PHARE/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DHDF5_PREFER_PARALLEL=ON \
            -DHighFive=ON \
            -Dtest=ON \
            -DPHARE_EXEC_LEVEL_MIN=10 \
            -DPHARE_EXEC_LEVEL_MAX=10 \
            -DPHARE_PYTHONPATH="$RUNNER_TEMP/phare-venv/bin/python"
          echo '=== TEST REGISTRATION INVENTORY ==='
          ctest --test-dir PHARE/build -N -R 'dispersion' || true
          echo 'CMake configuration completed. This does not establish solver validity.'

      - name: Build PHARE with conservative parallelism
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/phare-venv/bin:$PATH"
          cmake --build PHARE/build --parallel 2
          echo 'PHARE build finished. Plasma physics benchmarks have not yet been executed.'

      - name: Record evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo '### Project Shield PHARE build preflight'
            echo "- Pinned upstream PHARE revision: \`$PHARE_COMMIT\`"
            echo '- Review individual step logs for actual configure/build outcome.'
            echo '- No plasma-wave benchmark or Project Shield simulation is executed by this workflow.'
            echo '- Builds run on an ephemeral hosted runner; source/build files are not preserved after completion.'
          } >> "$GITHUB_STEP_SUMMARY"
