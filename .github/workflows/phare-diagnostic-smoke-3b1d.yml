name: Project Shield L1 - Phase 3B.1D Diagnostic Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shield-phase3b1d-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: One pinned PHARE build, one 50-step diagnostic run
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      PHARE_COMMIT: 7e5c72c1e5eec5452c8e3cfd000ce26c01e084ef
      PHARE_REMOTE: https://github.com/PHAREHUB/PHARE.git
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Checkout research revision and bounded resource preflight
        uses: actions/checkout@v4
      - name: Record inputs and check disk and memory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shield-evidence
          test -f scripts/p3b1d_smoke.py
          {
            echo "UTC $(date -u --iso-8601=seconds)"
            echo "Research commit $GITHUB_SHA"
            echo "PHARE commit $PHARE_COMMIT"
            uname -a
            cat /etc/os-release
            free -h
            df -h .
            python3 --version
            cmake --version | head -1
          } > shield-evidence/environment.txt
          sha256sum scripts/p3b1d_smoke.py \
            .github/workflows/phare-diagnostic-smoke-3b1d.yml \
            > shield-evidence/study-code.sha256
          avail=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
          free_disk=$(df -Pk . | awk 'NR==2 {print $4}')
          if [ "$avail" -lt 4194304 ] || [ "$free_disk" -lt 10485760 ]; then
            echo 'STOP: under 4 GiB memory or under 10 GiB disk available' | tee shield-evidence/resource-failure.txt
            exit 78
          fi
          cat > shield-evidence/protocol-scope.txt <<'EOF'
          Exactly one diagnostic smoke, N=64, dx=0.1, ppc=100, seed=314159,
          dt=0.001, t_final=0.05, Te=0, eta=0, hyper_resistivity=0,
          three snapshots at t=0, 0.025, 0.05; post-advance fields and ion particles.
          NO physical conservation-law qualification. NO 8-case campaign.
          Hard limits: job <=40 minutes, build <=30 minutes, solver <=3 minutes,
          each simulation output file <=16 MiB via shell ulimit -f,
          total HDF5 bytes <=64 MiB. GitHub artifact retained 14 days.
          After review, archive evidence permanently to Project Shield Audit Reports.
          EOF

      - name: Install validated PHARE dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gfortran git pkg-config \
            openmpi-bin libopenmpi-dev libhdf5-openmpi-dev \
            python3-dev python3-venv
          h5pcc -showconfig > shield-evidence/hdf5-config.txt
          grep -Eqi 'Parallel HDF5:[[:space:]]*yes' shield-evidence/hdf5-config.txt
          dpkg-query -W openmpi-bin libopenmpi-dev libhdf5-openmpi-dev \
            > shield-evidence/installed-dependencies.txt

      - name: Fetch pinned source and Python packages
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$PHARE_REMOTE" PHARE
          git -C PHARE checkout --detach "$PHARE_COMMIT"
          test "$(git -C PHARE rev-parse HEAD)" = "$PHARE_COMMIT"
          git -C PHARE log -1 --format='%H %cI %s' > shield-evidence/phare-revision.txt
          python3 -m venv "$RUNNER_TEMP/phare-venv"
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip install \
            -r PHARE/requirements.txt ddt pybind11
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip freeze > shield-evidence/python-packages.txt

      - name: Build pinned PHARE with double-precision diagnostics
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/phare-venv/bin:$PATH"
          timeout --signal=TERM --kill-after=15s 1800s cmake -S PHARE -B PHARE/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DCMAKE_CXX_FLAGS='-DPHARE_DIAG_DOUBLES=1' \
            -DHDF5_PREFER_PARALLEL=ON \
            -DHighFive=ON \
            -Dtest=ON \
            -DPHARE_EXEC_LEVEL_MIN=10 \
            -DPHARE_EXEC_LEVEL_MAX=10 \
            2>&1 | tee shield-evidence/cmake-configure.log
          timeout --signal=TERM --kill-after=15s 1800s \
            cmake --build PHARE/build --parallel 2 2>&1 | tee shield-evidence/build.log

      - name: Run ONE 50-step PHARE diagnostic case (180 second subprocess cap)
        shell: bash
        run: |
          set -euo pipefail
          unset PHARE_DRY_RUN || true
          export PATH="$RUNNER_TEMP/phare-venv/bin:$PATH"
          export PHARE_SOURCE_ROOT="$GITHUB_WORKSPACE/PHARE"
          export PYTHONPATH="$GITHUB_WORKSPACE/PHARE/build:$GITHUB_WORKSPACE/PHARE/pyphare${PYTHONPATH:+:$PYTHONPATH}"
          ulimit -f 16384
          timeout --signal=TERM --kill-after=10s 180s \
            /usr/bin/time -v -o shield-evidence/solver-resource-usage.txt \
            "$RUNNER_TEMP/phare-venv/bin/python" \
            scripts/p3b1d_smoke.py run --outdir shield-diagnostics \
            2>&1 | tee shield-evidence/solver.log

      - name: Check HDF5 schema and nominal time alignment, not conservation
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/phare-venv/bin/python" scripts/p3b1d_smoke.py inspect \
            --diagdir shield-diagnostics \
            --report shield-evidence/diagnostic-contract-report.json \
            --require-phare-provenance \
            2>&1 | tee shield-evidence/diagnostic-contract.log

      - name: Preserve hashes and analysis status
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          find shield-diagnostics -type f -print0 2>/dev/null | sort -z | \
            xargs -0 -r sha256sum > shield-evidence/all-raw-files.sha256 || true
          find shield-evidence -type f ! -name 'evidence-hashes.sha256' -print0 | \
            sort -z | xargs -0 -r sha256sum > shield-evidence/evidence-hashes.sha256 || true
          {
            echo '## Phase 3B.1D: one bounded diagnostic smoke test'
            echo 'This validates the existence, format, precision and nominal time of PHARE outputs only.'
            echo 'Review diagnostic-contract-report.json and raw HDF5. No conservation PASS is claimed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain raw and partial evidence after success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shield-p3b1d-one-diagnostic-${{ github.run_id }}
          path: |
            shield-evidence/
            shield-diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
