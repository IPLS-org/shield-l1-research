name: Project Shield L1 - Phase 3B.1D Controlled Particle-Seed Sensitivity

on:
  workflow_dispatch:
    inputs:
      confirm_seed128:
        description: "Authorise ONE alternative-seed 128-cell, 2000-step run only"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: read

concurrency:
  group: shield-p3b1d-seed128-one
  cancel-in-progress: false

jobs:
  one-seed128:
    name: One pinned PHARE build, ONE alternate-seed 128-cell case
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DEBIAN_FRONTEND: noninteractive
      PHARE_COMMIT: 7e5c72c1e5eec5452c8e3cfd000ce26c01e084ef
      PHARE_REMOTE: https://github.com/PHAREHUB/PHARE.git
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      PROTOCOL: protocol/phase3b1d-seed-128-v0.7.json
      REFERENCE: protocol/p3b1d-seed-reference-run44819929641.json
    steps:
      - name: Checkout research code at full action SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Record signed-off inputs and bounded resources
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_seed128 }}" != "YES" ]; then
            echo 'No explicit approval for ONE 128-cell alternate-seed run; aborting before resource use' >&2
            exit 78
          fi
          mkdir -p shield-evidence
          sha256sum scripts/p3b1d_seed128_run.py scripts/p3b1d_seed128_analyse.py scripts/p3b1d_perturbed_analyse.py \
            "$PROTOCOL" "$REFERENCE" .github/workflows/phare-seed128-sensitivity-3b1d.yml \
            > shield-evidence/registered-inputs.sha256
          cp "$PROTOCOL" "$REFERENCE" shield-evidence/
          {
            echo "UTC $(date -u --iso-8601=seconds)"
            echo "Research commit $GITHUB_SHA"
            echo "PHARE commit $PHARE_COMMIT"
            uname -a
            cat /etc/os-release
            free -h
            df -h .
            python3 --version
            cmake --version | head -1
          } > shield-evidence/runner-environment.txt
          avail=$(awk '/^MemAvailable:/ {print $2}' /proc/meminfo)
          free_disk=$(df -Pk . | awk 'NR==2 {print $4}')
          if [ "$avail" -lt 4194304 ] || [ "$free_disk" -lt 10485760 ]; then
            echo 'Resource gate: <4 GiB available RAM or <10 GiB free disk' | tee shield-evidence/early-failure.txt
            exit 78
          fi
          python3 -m json.tool "$PROTOCOL" > /dev/null
          python3 - <<'PY'
          import json,os
          m=json.load(open(os.environ['PROTOCOL']))
          c=m['case']; assert c['cells']==128 and c['dx']==.05 and c['particles_per_cell']==400 and c['seed']==271828
          assert c['time_step']==.0005 and c['solver_steps']==2000 and c['snapshot_every_steps']==200
          assert c['field_amplitude']==.01 and c['electron_temperature']==0
          assert m['phare_commit']==os.environ['PHARE_COMMIT']
          import hashlib
          br=open(os.environ['REFERENCE'],'rb').read()
          assert hashlib.sha256(br).hexdigest()==m['baseline_reference_sha256']
          b=json.loads(br)['baseline_case']
          assert {k for k in c if c[k]!=b[k]}==set(m['changed_case_parameters_only'])=={'name','seed'}
          assert b['seed']==314159 and c['seed']==271828
          assert m['grid_control']['smallest_patch_size']==m['grid_control']['largest_patch_size']==128
          assert b['cells']==c['cells']==128 and b['dx']==c['dx']==.05
          assert b['time_step']==c['time_step']==.0005 and b['solver_steps']==c['solver_steps']==2000
          print('One-case frozen same-mesh alternative-seed protocol preflight passed')
          PY

      - name: Install validated PHARE dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build gfortran git pkg-config \
            openmpi-bin libopenmpi-dev libhdf5-openmpi-dev \
            python3-dev python3-venv
          h5pcc -showconfig > shield-evidence/hdf5-configuration.txt
          grep -Eqi 'Parallel HDF5:[[:space:]]*yes' shield-evidence/hdf5-configuration.txt
          dpkg-query -W openmpi-bin libopenmpi-dev libhdf5-openmpi-dev \
            > shield-evidence/mpi-hdf5-packages.txt

      - name: Fetch pinned source and Python packages
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$PHARE_REMOTE" PHARE
          git -C PHARE checkout --detach "$PHARE_COMMIT"
          test "$(git -C PHARE rev-parse HEAD)" = "$PHARE_COMMIT"
          git -C PHARE log -1 --format='%H %cI %s' > shield-evidence/phare-source.txt
          python3 -m venv "$RUNNER_TEMP/phare-venv"
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip install \
            -r PHARE/requirements.txt ddt pybind11
          "$RUNNER_TEMP/phare-venv/bin/python" -m pip freeze > shield-evidence/python-packages.txt

      - name: Configure and build double-diagnostic PHARE once
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/phare-venv/bin:$PATH"
          timeout --signal=TERM --kill-after=15s 1800s \
            cmake -S PHARE -B PHARE/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=mpicc \
            -DCMAKE_CXX_COMPILER=mpicxx \
            -DCMAKE_CXX_FLAGS='-DPHARE_DIAG_DOUBLES=1' \
            -DHDF5_PREFER_PARALLEL=ON \
            -DHighFive=ON -Dtest=ON \
            -DPHARE_EXEC_LEVEL_MIN=10 -DPHARE_EXEC_LEVEL_MAX=10 \
            2>&1 | tee shield-evidence/cmake-configure.log
          timeout --signal=TERM --kill-after=15s 1800s \
            cmake --build PHARE/build --parallel 2 2>&1 | tee shield-evidence/phare-build.log

      - name: Execute exactly ONE alternate-seed 128-cell, 2000-step perturbation (300 second cap)
        shell: bash
        run: |
          set -euo pipefail
          unset PHARE_DRY_RUN || true
          export PATH="$RUNNER_TEMP/phare-venv/bin:$PATH"
          export PHARE_SOURCE_ROOT="$GITHUB_WORKSPACE/PHARE"
          export PYTHONPATH="$GITHUB_WORKSPACE/PHARE/build:$GITHUB_WORKSPACE/PHARE/pyphare${PYTHONPATH:+:$PYTHONPATH}"
          ulimit -f 32768
          timeout --signal=TERM --kill-after=10s 300s \
            /usr/bin/time -v -o shield-evidence/solver-resource-usage.txt \
            "$RUNNER_TEMP/phare-venv/bin/python" \
            scripts/p3b1d_seed128_run.py \
            --protocol "$PROTOCOL" --outdir shield-seed128-diagnostics \
            2>&1 | tee shield-evidence/solver.log

      - name: Screen raw HDF5 against conserved quantities and frozen same-mesh seed gates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/phare-venv/bin:$PATH"
          "$RUNNER_TEMP/phare-venv/bin/python" \
            scripts/p3b1d_seed128_analyse.py \
            --protocol "$PROTOCOL" --reference "$REFERENCE" \
            --diagdir shield-seed128-diagnostics \
            --outdir shield-evidence/seed-pair-assessment \
            2>&1 | tee shield-evidence/assessment.log

      - name: Checksums and transparent limitations
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          find shield-seed128-diagnostics -type f -print0 2>/dev/null | \
            sort -z | xargs -0 -r sha256sum > shield-evidence/raw-files.sha256 || true
          find shield-evidence -type f ! -name 'evidence-files.sha256' -print0 | \
            sort -z | xargs -0 -r sha256sum > shield-evidence/evidence-files.sha256 || true
          {
            echo '## Phase 3B.1D: ONE alternate-seed 128-cell paired 1D ideal-hybrid screen'
            echo 'Review seed-pair-assessment/seed_sensitivity_assessment.json for PASS / FAIL / INCONCLUSIVE.'
            echo 'Two particle seeds at one grid do NOT estimate sampling variance, confidence intervals or grid convergence.'
            echo 'No magnetic obstacle, L1 solar wind, shielding or geoeffectiveness was simulated.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve all raw and partial evidence, including on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shield-p3b1d-seed128-${{ github.run_id }}
          path: |
            shield-evidence/
            shield-seed128-diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
